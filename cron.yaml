# Render Cron Job - Scorpion Elite Scheduler
# Se ejecuta automáticamente a las 00:00 UTC todos los días

cron:
  - name: "Scorpion Elite Daily Scheduler"
    url: "https://scorpion-elite.onrender.com/api/scheduler"
    schedule: "0 0 * * *"  # 00:00 UTC todos los días
    script: python scheduler.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
